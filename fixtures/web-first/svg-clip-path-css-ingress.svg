<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <style>
    .sheet-target { clip-path: url(#sheet-clip); }
    .none-wins { clip-path: none; }
  </style>
  <rect width="64" height="64" fill="#ffffff"/>
  <defs>
    <clipPath id="attr-clip"><rect x="2" y="2" width="9" height="18"/></clipPath>
    <clipPath id="style-clip"><rect x="32" y="2" width="9" height="18"/></clipPath>
    <clipPath id="sheet-clip"><rect x="44" y="2" width="18" height="9"/></clipPath>
    <clipPath id="vendor-clip"><rect x="2" y="32" width="18" height="9"/></clipPath>
    <clipPath id="var-clip"><path d="M23 23H41V41Z"/></clipPath>
    <clipPath id="duplicate"><rect x="44" y="44" width="9" height="18"/></clipPath>
    <clipPath id="duplicate"><rect x="44" y="44" width="18" height="18"/></clipPath>
  </defs>
  <rect x="2" y="2" width="18" height="18" fill="#16a34a" clip-path="url(#attr-clip)"/>
  <rect x="23" y="2" width="18" height="18" fill="#2563eb" style="clip-path:url(#style-clip)"/>
  <rect class="sheet-target" x="44" y="2" width="18" height="18" fill="#ef4444"/>
  <rect x="2" y="23" width="18" height="18" fill="#f59e0b" style="-webkit-clip-path:url(#vendor-clip)"/>
  <rect x="23" y="23" width="18" height="18" fill="#7c3aed" clip-path="var(--clip)" style="--clip:url(#var-clip)"/>
  <rect class="none-wins" x="44" y="23" width="18" height="18" fill="#0891b2" clip-path="url(#attr-clip)"/>
  <rect x="2" y="44" width="18" height="18" fill="#db2777" clip-path="url(#missing)"/>
  <rect x="23" y="44" width="18" height="18" fill="#65a30d" clip-path="not-a-clip"/>
  <rect x="44" y="44" width="18" height="18" fill="#0f766e" clip-path="url(#duplicate)"/>
</svg>
