[package]
name = "websem"
version = "0.0.0"
edition = "2024"
description = "PROVISIONAL, INTERNAL, BREAKABLE. The Web semantic compiler: an SVG or HTML source through one namespace-aware document and one Stylo cascade into rframe::Frame, at Base or one exact-time sample. Owns no document parser and no painter. No I/O, no network."
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Source-neutral exact time, timing, easing, and scalar sampling. SVG syntax
# and target association stay in this Web semantic producer.
animation-sampling = { path = "../animation-sampling" }
# The selected source-neutral leaf-paint vocabulary.
cg = { path = "../cg" }
# The source-neutral resolved render contract this crate produces.
# Contract-only and backend-free; the n0 engine owns the one downstream.
rframe = { path = "../rframe" }
# The Web family's text resolution oracle (the text rung): websem states what
# the document says, textlayout states what the glyphs are. No font byte and
# no ambient face enters through this edge — the environment is the host's.
textlayout = { path = "../textlayout" }
# Neutral geometry.
math2 = { path = "../math2" }
# The one namespace-aware document + the one (Stylo) browser-grade cascade.
csscascade = { path = "../csscascade" }
# Read computed values (e.g. `color`) out of the shared cascade. Imported as `style`.
stylo.workspace = true
# Parse the `stop-color` attribute with the same CSS parser the cascade uses
# (the pinned cascade cannot represent the longhand, so the attribute is the
# one authoring surface this slice consumes).
style_traits.workspace = true
# Name the resolved-URL type behind the cascade's paint-server references, to
# take the same-document fragment off it.
url = "2.5"

[dev-dependencies]
# Pixel gates render the resolved frame through the n0-owned compiler and
# painter — the one downstream. This edge is test-only; websem remains
# backend-free.
n0 = { path = "../n0" }
# Pixel gates drive Skia directly for CPU surfaces and committed Chromium
# oracle PNG decode. Test-only; this does not widen websem's normal library
# dependency graph.
skia-safe = { version = "=0.99.0", features = [
  "gpu",
  "gl",
  "textlayout",
  "pdf",
  "svg",
  "webp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints]
workspace = true
