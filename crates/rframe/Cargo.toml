[package]
name = "rframe"
version = "0.0.0"
edition = "2024"
description = "PROVISIONAL, INTERNAL, BREAKABLE. The Web-first track's source-neutral resolved render contract (`Frame`). Contract-only and backend-free: the n0 engine owns the one downstream drawlist and painter (D-M). Produced by websem; not published; not a file format; no round-trip promise."
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The selected shared leaf-paint vocabulary. The resolved contract owns no
# producer-local paint duplicate.
cg = { path = "../cg" }
# Neutral geometry foundation shared across the workspace (backend-free).
math2 = { path = "../math2" }

[lints]
workspace = true
