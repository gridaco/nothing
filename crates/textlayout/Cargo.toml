[package]
name = "textlayout"
version = "0.0.0"
edition = "2024"
description = "PROVISIONAL, INTERNAL, BREAKABLE. The Web family's text resolution oracle: attributed text + a declared font environment -> one immutable resolved text layout, or a typed refusal. Implements the minimal profile of docs/wg/feat-paragraph/text-layout.md at oracle v1."
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The one shaping dependency, pinned exactly: ORACLE_VERSION's stability
# claim is mechanical only if the shaper cannot drift under it. ttf-parser is
# consumed through rustybuzz's re-export so exactly one face type exists;
# the coordinate is the one the workspace lock already carries via vendored
# usvg, and the oracle version was measured against it.
rustybuzz = "=0.20.1"

[lints]
workspace = true
