[package]
name = "n0"
version = "0.0.0"
edition = "2021"
homepage.workspace = true
license.workspace = true
repository.workspace = true
description = "A 2D graphics engine."
categories = ["graphics", "rendering"]
keywords = ["graphics", "2d", "rendering", "engine"]
readme = "README.md"

[features]
# observability compiled to zero unless asked — the profiler must never
# distort the profile.
trace = []
# The headless-GPU probe (probe_gpu): real GL flush timing for the two
# GPU-only wins (scene raster cache, layerization) that raster mis-signs.
# Optional so the default raster build (probe, gate, n0_dev) stays GL-free.
native-gl-context = ["dep:glutin", "dep:gl", "dep:raw-window-handle"]

[dependencies]
# Source-neutral geometry and the resolved-frame contract n0 compiles into
# its one private drawlist and painter. The
# contract crate is backend-free by construction.
math2 = { path = "../math2" }
rframe = { path = "../rframe" }
# The D-C shared leaf vocabulary. The validated paint stack arrives through
# rframe; destructuring its admitted variants (solids, linear and radial
# gradients) into the private drawlist reads the shared leaves directly.
cg = { path = "../cg" }
# serde feature ON: the op-log wire for replay (`Op` becomes serializable).
n0-model = { path = "../n0-model", features = ["serde"] }
serde_json = "1.0"
sha2 = "0.10"

# `use skia_safe` stays confined to paint.rs — raster access is a single
# module's concern (see src/lib.rs).
skia-safe = { version = "=0.99.0", features = [
  "gpu",
  "gl",
  "textlayout",
  "pdf",
  "svg",
  "webp",
] }

# Headless-GPU probe only (feature native-gl-context). Versions match the
# workspace winit hosts (n0_dev / grida_dev).
glutin = { version = "0.32.0", optional = true }
gl = { version = "0.14.0", optional = true }
raw-window-handle = { version = "0.6.0", optional = true }

[dev-dependencies]
# The D-M text-stage deciding spike only (src/text_join_spike.rs): the Web
# family's shaped-text producer pushed at the candidate neutral contract next
# to n0's own. Never a shipping dependency — the text stage joined low, and
# the spike's architecture lock holds this crate to dev-only consumption.
textlayout = { path = "../textlayout" }

[lints]
workspace = true
