# Authorised Cargo.lock graph moves
#
# `bin/check-cargo-lock-additions-only` requires a crate cut to leave the
# dependency graph additions-only: no package dropped, no locked version
# withdrawn.  A registered decision can have dependency provenance as its
# subject, though, and such a decision cannot satisfy a rule that forbids the
# graph from moving at all.  This file is where those moves are written down.
#
# One `[[change]]` per withdrawn version.  The gate matches `package`, `from`
# and `to` exactly against the two lockfiles, so a row authorises one move and
# nothing else; anything not listed here still fails.  Rows are a permanent
# record — they stay after the move has merged, and go inert on their own once
# the base already carries `to`.
#
# `decision` names the registry entry that authorises the move.  Adding a row
# without one is the thing this file exists to prevent.

# ---------------------------------------------------------------------------
# D-L — pin official Stylo SVG paint support
#
# The workspace tracks Stylo by git revision.  D-L moves that pin to
# `a64923b5d5c67313c81c5056f5e30ec0babb04d6`, which carries Stylo's own SVG
# paint properties.  Every row below is a consequence of that one pin: seven
# crates are members of the pinned tree, four are its direct requirements, and
# the rest are forced transitively.  Pinning any of them back was attempted and
# refused by cargo — `stylo_static_prefs 0.19.0` requires `toml ^1.1.2`, and
# `stylo 0.19.0` requires `indexmap ^2`, which in turn requires
# `hashbrown ^0.16.1`.
#
# No package is dropped by this move, and no package is renamed.
# ---------------------------------------------------------------------------

[[change]]
decision = "D-L"
package = "stylo"
from = "0.16.0"
to = "0.19.0"
why = "the pinned Stylo revision itself"

